name: Ubuntu build
on:
  push:
    branches:
      - source

  schedule:
    - cron: 0 4 * * 0 # rebuild every Sunday at 4am

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cabal: ["3.10.3.0"]
        ghc: ["9.8.2"]
    steps:

########################################################################
## INSTALLATION STEP
########################################################################

      - name: Install dependencies
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '${{ matrix.ghc }}'
          cabal-version: '${{ matrix.cabal }}'

      - name: Cache ~/.cabal/store and dist-newstyle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/src/dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.cabal }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.cabal }}-${{ github.sha }}
            ${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.cabal }}

########################################################################
## BUILD STEP
########################################################################

      # By default github actions do not pull the repo
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Build site
        run: |
          cd src/
          cabal build
          cabal exec www-gallais build
          cp -R ../css ../pdf ../img ../splv23 _site/

########################################################################
## DEPLOY STEP
########################################################################

      - name: Deploy HTML
        uses: JamesIves/github-pages-deploy-action@v4.4.3

        with:
          branch: gh-pages
          folder: src/_site
          git-config-name: Github Actions
